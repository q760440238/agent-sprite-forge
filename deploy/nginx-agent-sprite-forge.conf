limit_req_zone $binary_remote_addr zone=sprite_forge_generate:10m rate=3r/m;
limit_conn_zone $binary_remote_addr zone=sprite_forge_per_ip:10m;

server {
    listen 80;
    listen [::]:80;
    server_name mh.mtou.fun;

    location = /agent-sprite-forge {
        return 308 /agent-sprite-forge/;
    }

    location /agent-sprite-forge/ {
        proxy_pass http://127.0.0.1:14660/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /agent-sprite-forge;
        proxy_buffering off;
        proxy_read_timeout 660s;
        proxy_send_timeout 660s;
        client_max_body_size 40m;
    }

    location = /agent-sprite-forge/api/generate {
        limit_req zone=sprite_forge_generate burst=2 nodelay;
        limit_conn sprite_forge_per_ip 4;
        proxy_pass http://127.0.0.1:14660/api/generate;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /agent-sprite-forge;
        client_max_body_size 40m;
    }

    # Preserve the current root site after the DNS record moves to this host.
    location / {
        proxy_pass http://115.191.30.208;
        proxy_http_version 1.1;
        proxy_set_header Host mh.mtou.fun;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Public direct access for the Sprite Forge WebUI.
server {
    listen 16600;
    listen [::]:16600;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:14660;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 660s;
        proxy_send_timeout 660s;
        client_max_body_size 40m;
    }

    location = /api/generate {
        limit_req zone=sprite_forge_generate burst=2 nodelay;
        limit_conn sprite_forge_per_ip 4;
        proxy_pass http://127.0.0.1:14660/api/generate;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 40m;
    }
}
